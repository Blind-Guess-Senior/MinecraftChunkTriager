[project]
name = "chunktriager"
version = "0.1.0"
description = "Label Minecraft chunks for keep/delete triage"
authors = [
    { name = "Blind-Guess-Senior", email = "94767867+Blind-Guess-Senior@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "lightgbm==4.7.0",
    "nbtlib==2.0.4",
    "numpy==2.2.5",
    "pillow==11.2.1",
    "pyarrow==20.0.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "uvicorn==0.34.2",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[project.scripts]
chunktriager = "chunktriager.cli:main"
